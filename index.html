  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      font-family: 'Poppins', sans-serif; 
      background-color: #1a1a1a;
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    .font-serif { font-family: 'Cinzel', serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.3s ease-out; }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    #lightbox.active { display: flex; }
    #lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }
    #lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #lightbox-close:hover { background: rgba(255,255,255,0.3); }
    #lightbox-caption {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      color: #fff;
      font-size: 0.95rem;
      font-family: 'Poppins', sans-serif;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
  </style>

  <script>
    // Lightbox
    function openLightbox(src, caption) {
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox-caption").textContent = caption;
      lb.classList.add("active");
      document.body.style.overflow = "hidden";
    }
    function closeLightbox(e) {
      if (e && e.target.id === "lightbox-img") return;
      document.getElementById("lightbox").classList.remove("active");
      document.body.style.overflow = "";
    }

        ]

      {

        items: [

          { id: "aguaMesa", nombre: "Agua de mesa con o sin gas (500 cc)", precio: 3600 },
          { id: "gaseosa", nombre: "Gaseosa (350 cc)", precio: 3600 },
        ]
      },
      {
        id: "menuInfantil",
        nombre: "Menú Infantil",
        items: [
          { id: "supremaInfantil", nombre: "Suprema de pollo c/guarnición", precio: 9700 },
          { id: "milanesaInfantil", nombre: "Milanesa de ternera c/guarnición", precio: 9700 },
          { id: "merluzaInfantil", nombre: "Merluza a la romana c/guarnición", precio: 9500 },
          { id: "noquiInfantil", nombre: "Ñoquis de papa con tuco o crema", precio: 7900 },
          { id: "tallarinesInfantil", nombre: "Tallarines con tuco o crema", precio: 7400 },
        ]
      },
    ];

    // State
    let cart = {};
    let orderType = 'mesa';
    let activeCategory = menuData[0].id;

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderCategoryNav();
      renderMenu();
      setupScrollObserver();
    });

    // Order Type
    function setOrderType(type) {
      orderType = type;
      document.querySelectorAll('.order-type-btn').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-primary-foreground');
        btn.classList.add('bg-secondary', 'text-secondary-foreground');
      });
      document.getElementById(`btn-${type}`).classList.remove('bg-secondary', 'text-secondary-foreground');
      document.getElementById(`btn-${type}`).classList.add('bg-primary', 'text-primary-foreground');
      
      document.getElementById('field-mesa').classList.add('hidden');
      document.getElementById('field-delivery').classList.add('hidden');
      
      if (type === 'mesa') {
        document.getElementById('field-mesa').classList.remove('hidden');
      } else if (type === 'delivery') {
        document.getElementById('field-delivery').classList.remove('hidden');
      }
    }

    // Category Navigation
    function renderCategoryNav() {
      const nav = document.querySelector('#category-nav > div');
      nav.innerHTML = menuData.map(cat => `
        <button 
          onclick="scrollToCategory('${cat.id}')"
          id="nav-${cat.id}"
          class="category-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium transition-all whitespace-nowrap ${cat.id === activeCategory ? 'bg-primary text-primary-foreground' : 'bg-secondary text-secondary-foreground hover:bg-secondary/80'}"
        >
          ${cat.nombre}
        </button>
      `).join('');
    }

    function scrollToCategory(categoryId) {
      const element = document.getElementById(`section-${categoryId}`);
      if (element) {
        const navHeight = document.getElementById('category-nav').offsetHeight;
        const y = element.getBoundingClientRect().top + window.pageYOffset - navHeight - 16;
        window.scrollTo({ top: y, behavior: 'smooth' });
      }
    }

    function setActiveCategory(categoryId) {
      activeCategory = categoryId;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-primary-foreground');
        btn.classList.add('bg-secondary', 'text-secondary-foreground');
      });
      const activeBtn = document.getElementById(`nav-${categoryId}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-secondary', 'text-secondary-foreground');
        activeBtn.classList.add('bg-primary', 'text-primary-foreground');
        activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    function setupScrollObserver() {
      const options = { rootMargin: '-20% 0px -70% 0px' };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const categoryId = entry.target.id.replace('section-', '');
            setActiveCategory(categoryId);
          }
        });
      }, options);

      menuData.forEach(cat => {
        const section = document.getElementById(`section-${cat.id}`);
        if (section) observer.observe(section);
      });
    }

    // Menu Rendering
    function renderMenu() {
      const content = document.getElementById('menu-content');
      content.innerHTML = menuData.map(category => `
        <section id="section-${category.id}" class="mb-10">
          <div class="flex items-center gap-3 mb-5 pb-2 border-b border-border">
            <h2 class="text-xl md:text-2xl font-serif text-primary">${category.nombre}</h2>
            <span class="text-xs text-muted-foreground bg-secondary px-2 py-1 rounded-full">${category.items.length} items</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            ${category.items.map(item => renderMenuItem(item)).join('')}
          </div>
        </section>
      `).join('');
    }

    function renderMenuItem(item) {
      const quantity = cart[item.id] || 0;
      const hasImage = item.imagen;
      
      return `
        <div class="group bg-card rounded-xl border ${item.destacado ? 'border-primary/30 ring-1 ring-primary/20' : 'border-border'} ${quantity > 0 ? 'border-primary/60' : ''} overflow-hidden transition-all hover:border-primary/50 hover:shadow-lg hover:shadow-primary/5">
          ${hasImage ? `
            <div class="relative h-36 md:h-44 overflow-hidden cursor-pointer" onclick="openLightbox('${item.imagen}', '${item.nombre}')">
              <img src="${item.imagen}" alt="${item.nombre}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
              <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/20">
                <div class="bg-black/50 rounded-full p-2">
                  <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/></svg>
                </div>
              </div>
              ${item.destacado ? `
                <div class="absolute top-2 left-2 bg-primary text-primary-foreground text-xs px-2 py-1 rounded-full flex items-center gap-1">
                  <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                  Destacado
                </div>
              ` : ''}
            </div>
          ` : ''}
          <div class="p-4">
            <div class="flex items-start justify-between gap-3">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  ${!hasImage && item.destacado ? `
                    <svg class="w-4 h-4 text-primary fill-primary flex-shrink-0" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                  ` : ''}
                  <h3 class="font-semibold text-foreground text-sm md:text-base leading-tight truncate">${item.nombre}</h3>
                </div>
                ${item.descripcion ? `<p class="text-muted-foreground text-xs md:text-sm mt-1 line-clamp-2">${item.descripcion}</p>` : ''}
              </div>
              <span class="text-primary font-bold text-sm md:text-base flex-shrink-0">${formatPrice(item.precio)}</span>
            </div>
            <div class="flex items-center justify-end gap-3 mt-4">
              <button onclick="removeFromCart('${item.id}')" class="w-9 h-9 rounded-lg flex items-center justify-center transition-all ${quantity > 0 ? 'bg-secondary text-foreground hover:bg-secondary/80' : 'bg-muted text-muted-foreground cursor-not-allowed'}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
              </button>
              <span class="w-8 text-center font-bold text-base ${quantity > 0 ? 'text-primary' : 'text-muted-foreground'}">${quantity}</span>
              <button onclick="addToCart('${item.id}')" class="w-9 h-9 rounded-lg bg-primary text-primary-foreground hover:bg-primary/90 flex items-center justify-center transition-all active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // Cart Functions
    function addToCart(itemId) {
      cart[itemId] = (cart[itemId] || 0) + 1;
      updateCartUI();
      renderMenu();
    }

    function removeFromCart(itemId) {
      if (cart[itemId] > 0) {
        cart[itemId]--;
        if (cart[itemId] === 0) delete cart[itemId];
        updateCartUI();
        renderMenu();
      }
    }

    function updateCartUI() {
      const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
      const totalPrice = Object.entries(cart).reduce((total, [itemId, qty]) => {
        const item = findItem(itemId);
        return total + (item ? item.precio * qty : 0);
      }, 0);

      const badge = document.getElementById('cart-badge');
      const totalEl = document.getElementById('cart-total');
      const whatsappBtn = document.getElementById('whatsapp-btn');

      badge.textContent = totalItems;
      badge.classList.toggle('hidden', totalItems === 0);
      totalEl.textContent = formatPrice(totalPrice);

      if (totalItems > 0) {
        whatsappBtn.disabled = false;
        whatsappBtn.classList.remove('bg-muted', 'text-muted-foreground');
        whatsappBtn.classList.add('bg-whatsapp', 'text-white', 'hover:bg-whatsapp/90');
      } else {
        whatsappBtn.disabled = true;
        whatsappBtn.classList.add('bg-muted', 'text-muted-foreground');
        whatsappBtn.classList.remove('bg-whatsapp', 'text-white', 'hover:bg-whatsapp/90');
      }
    }

    function findItem(itemId) {
      for (const category of menuData) {
        const item = category.items.find(i => i.id === itemId);
        if (item) return item;
      }
      return null;
    }

    function formatPrice(price) {
      return new Intl.NumberFormat('es-AR', {
        style: 'currency',
        currency: 'ARS',
        minimumFractionDigits: 0,
      }).format(price);
    }

    // WhatsApp
    function sendToWhatsApp() {
      const nombre = document.getElementById('input-nombre').value.trim();
      const mesa = document.getElementById('input-mesa').value.trim();
      const direccion = document.getElementById('input-direccion').value.trim();

      let mensaje = '*Nuevo Pedido - Mar & Tierra*\n\n';
      
      if (nombre) mensaje += `*Nombre:* ${nombre}\n`;
      
      if (orderType === 'mesa' && mesa) {
        mensaje += `*Mesa:* ${mesa}\n`;
      } else if (orderType === 'delivery' && direccion) {
        mensaje += `*Tipo:* Delivery\n*Dirección:* ${direccion}\n`;
      } else if (orderType === 'retiro') {
        mensaje += `*Tipo:* Retiro en local\n`;
      }
      
      mensaje += '\n*Pedido:*\n';
      
      let total = 0;
      Object.entries(cart).forEach(([itemId, qty]) => {
        const item = findItem(itemId);
        if (item) {
          const subtotal = item.precio * qty;
          total += subtotal;
          mensaje += `• ${qty}x ${item.nombre} - ${formatPrice(subtotal)}\n`;
        }
      });
      
      mensaje += `\n*Total: ${formatPrice(total)}*`;

      const phoneNumber = '543584867134'; // Cambiar por el número real
      const encodedMessage = encodeURIComponent(mensaje);
      window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
    }
  </script>
